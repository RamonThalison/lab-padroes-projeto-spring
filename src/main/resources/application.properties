# Nome exibido nos logs e no contexto do Spring.
spring.application.name=delivery-patterns-api

# Banco H2 em memória: simples para estudos e reiniciado a cada execução.
spring.datasource.url=jdbc:h2:mem:delivery
spring.h2.console.enabled=true

# Impede consultas JPA inesperadas durante a serialização da resposta HTTP.
spring.jpa.open-in-view=false
